<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">DukeAI Nexus current retrieval flow</title>
  <desc id="desc">Documents enter ingestion and metadata validation, then text processing and lexical retrieval and ranking, producing source passages for inspection.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 12 6 0 12z" fill="#536579"/></marker>
    <style>
      .h{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#10233F}.s{font:500 18px Inter,Segoe UI,Arial,sans-serif;fill:#536579}.box{fill:#F4F7FA;stroke:#AAB8C7;stroke-width:2}.teal{fill:#E5F5F3;stroke:#168D8A;stroke-width:2}.gold{fill:#FFF5DF;stroke:#C39332;stroke-width:2}.arrow{stroke:#536579;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="60" y="64" class="h">DukeAI Nexus — current retrieval prototype</text>
  <text x="60" y="98" class="s">A local, source-oriented pipeline; retrieved passages are not generated AI answers.</text>
  <rect x="55" y="190" width="205" height="140" rx="18" class="box"/>
  <text x="157" y="238" text-anchor="middle" class="h">Documents</text><text x="157" y="273" text-anchor="middle" class="s">Local text sources</text>
  <rect x="335" y="190" width="220" height="140" rx="18" class="teal"/>
  <text x="445" y="232" text-anchor="middle" class="h">Ingestion</text><text x="445" y="266" text-anchor="middle" class="s">Metadata validation</text><text x="445" y="294" text-anchor="middle" class="s">Source consistency</text>
  <rect x="630" y="190" width="220" height="140" rx="18" class="box"/>
  <text x="740" y="232" text-anchor="middle" class="h">Text processing</text><text x="740" y="266" text-anchor="middle" class="s">Tokenisation</text><text x="740" y="294" text-anchor="middle" class="s">Lexical features</text>
  <rect x="925" y="190" width="220" height="140" rx="18" class="gold"/>
  <text x="1035" y="232" text-anchor="middle" class="h">Retrieval</text><text x="1035" y="266" text-anchor="middle" class="s">Candidate selection</text><text x="1035" y="294" text-anchor="middle" class="s">Deterministic ranking</text>
  <path d="M260 260h68" class="arrow"/><path d="M555 260h68" class="arrow"/><path d="M850 260h68" class="arrow"/>
  <path d="M1035 330v58" class="arrow"/>
  <rect x="835" y="400" width="400" height="78" rx="16" class="teal"/>
  <text x="1035" y="432" text-anchor="middle" class="h">Source passages</text><text x="1035" y="459" text-anchor="middle" class="s">Returned for human inspection</text>
  <text x="60" y="450" class="s">Not depicted: language generation, translation, autonomous tools, or a deployed agent.</text>
</svg>
